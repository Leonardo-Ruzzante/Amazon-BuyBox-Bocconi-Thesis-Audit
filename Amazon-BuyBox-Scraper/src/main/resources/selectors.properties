# Local CSS selectors used by the HTML extractor.
# Multiple fallback selectors can be separated with ||.

product.title=#productTitle

buybox.container=#desktop_buybox||#buybox||#apex_desktop||body
buybox.price=#corePrice_feature_div .a-offscreen||#apex_desktop .a-price .a-offscreen||.a-price .a-offscreen
buybox.seller=#sellerProfileTriggerId||#merchant-info||#tabular-buybox .tabular-buybox-text
buybox.fulfillment=#tabular-buybox .tabular-buybox-text||#merchant-info
buybox.condition=#newAccordionRow .a-text-bold||#usedAccordionRow .a-text-bold||#availability
buybox.delivery=#unified-delivery-message-||#deliveryBlockMessage||#mir-layout-DELIVERY_BLOCK-slot-PRIMARY_DELIVERY_MESSAGE_LARGE||[id*=delivery]
buybox.rating=#acrPopover||#acrCustomerReviewText||i.a-icon-star span.a-icon-alt
buybox.reviewCount=#acrCustomerReviewText

offer.container=#aod-offer||.aod-offer||[id=aod-offer]
offer.price=#aod-price-INDEX .a-offscreen||.a-price .a-offscreen||.a-price-whole
offer.seller=#aod-offer-soldBy a||#aod-offer-soldBy .a-col-right||[id*=soldBy] a||[id*=soldBy] .a-col-right
offer.fulfillment=#aod-offer-shipsFrom .a-col-right||[id*=shipsFrom] .a-col-right||[id*=shipsFrom]
offer.condition=#aod-offer-heading||.aod-offer-heading||h5
offer.delivery=#mir-layout-DELIVERY_BLOCK||[id*=delivery]||[class*=delivery]
offer.rating=#aod-offer-seller-rating||[id*=seller-rating]||i.a-icon-star span.a-icon-alt
offer.reviewCount=#aod-offer-seller-rating||[id*=seller-rating]
offer.minimumQuantity=[id*=quantity]||[class*=quantity]
