dynamic_vacancy_design:
  outcome: rank_pct_improvement
  outcome_definition: lagged rank_pct minus current rank_pct; positive values indicate
    upward movement
  reference_exposure: dropouts_above
  reference_interaction: fba_from_shipper times dropouts_above
  fixed_effects:
  - seller_id
  - transition_id
  within_seller_diagnostic: rank outcomes and turnover exposure vary within seller;
    fba_from_shipper does not, so the identified dynamic term is the interaction between
    FBA status and time-varying turnover exposure
  inference: two-way clustering by seller and transition
  status: reference above-exposure table retained for above/below decomposition; not
    the final primary dynamic claim
dynamic_fba_premium_design:
  outcome: rank_pct_improvement
  outcome_definition: lagged rank_pct minus current rank_pct; positive values indicate
    upward movement
  primary_exposure: dropouts_total_focal
  primary_interaction: fba_from_shipper times dropouts_total_focal
  directional_control: fba_from_shipper times dropout_direction_balance
  fixed_effects:
  - seller_id
  - transition_id
  rank_position_validation:
    D1: seller_id and transition_id fixed effects with lag_rank_pct
    D2: D1 plus additive lag-rank-quartile indicators; q1_top_25pct omitted
    D3: D1 plus lag_rank_pct squared
    D4: seller_id and transition_id x lag_rank_tier fixed effects as a severe stress
      test
  strict_stress_fixed_effects:
  - seller_id
  - transition_id x lag_rank_tier
  inference: two-way clustering by seller and transition, plus CR2 and wild-cluster
    sensitivity for the premium coefficient
  status: main dynamic premium design, with hardening diagnostics reported in the
    main text
dynamic_hardening_design:
  clean_turnover_restrictions: one-sided above/no-below, below/no-above, single-sided,
    and mixed-turnover subsamples
  distance_banded_exposure: dropouts within 1, 3, 5, and 10 lag-rank positions above
    or below the focal seller
  partial_identification_bound: lambda_above minus lambda_below using joint covariance
    when available
  rank_tier_stress_role: severe support-sensitive stress test; not the primary rank-position-adjusted
    estimator
