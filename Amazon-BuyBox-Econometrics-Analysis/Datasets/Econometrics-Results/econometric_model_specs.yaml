headline_inference: two_way_seller_market
blocked_design_choices:
  machine_learning_residualization: excluded from this econometric notebook by design
  equal_market_size_sample_modification: excluded because it would change the target
    sample composition
  binary_outcomes: continuous rank_pct remains primary; entered_top_10 is included
    as a complementary binary-prominence estimand; other binary outcomes remain auxiliary
    salience screens
  seller_fixed_effects: not identified for FBA because final within-seller FBA switching
    equals zero
  shipping_interaction: excluded because FBA offers have zero shipping price support
    in the final sample
  estimator_zoo: not expanded into Plackett-Luce, GEE, or ordered beta because those
    estimators would change the estimand rather than directly stress-test the headline
    linear rank-percent association
fast_delivery_cost_imputation:
  premium_eur: 4.99
  premium_label: premium_delivery_baseline_eur_4_99
  sensitivity_grid_eur:
    pickup_point_lower_sensitivity_eur_3_99: 3.99
    premium_delivery_baseline_eur_4_99: 4.99
    same_day_upper_sensitivity_eur_8_99: 8.99
  variable: fast_delivery_cost_imputed
  definition: FAST_DELIVERY_PREMIUM_EUR multiplied by fast_delivery_available and
    fba_from_shipper
  source_role: External Amazon.it Premium fast-delivery benchmark supplied for the
    thesis analysis; baseline EUR 4.99, not directly observed in the scraped CSV
  collinearity_rule: Do not interpret fast_delivery_cost_imputed as a directly observed
    checkout price; it is an FBA-only logistics-value proxy.
  baseline_rule: EUR 4.99 is retained as the baseline Premium fast-delivery benchmark;
    EUR 3.99 and EUR 8.99 are sensitivity translations only.
